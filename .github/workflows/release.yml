name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm trusted publishing + provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:package

      # Versions with a hyphen (v2.1.0-beta.1) go to the "next" dist-tag and are marked prerelease
      - name: Publish to npm
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then tag=next; else tag=latest; fi
          npm publish --provenance --access public --tag "$tag"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/screeps/RoomVisual.js \
            --verify-tag --generate-notes $flags
